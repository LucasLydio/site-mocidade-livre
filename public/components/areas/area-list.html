
<section class="areas-map-section" aria-labelledby="areas-map-title">

    <p class="areas-eyebrow">cada área tem um propósito</p>
    <h2 id="areas-map-title">Escolha onde você quer servir</h2>
  </div>

  <div class="alert d-none" data-areas-alert role="alert"></div>

  <div class="areas-state" data-areas-loading>

    <div class="areas-orbit d-none" data-areas-grid aria-label="Áreas disponíveis"></div>
  </div>

  <div class="areas-empty d-none" data-areas-empty>Nenhuma área ativa no momento.</div>

  <div data-include="components/areas/area-card.html"></div>
